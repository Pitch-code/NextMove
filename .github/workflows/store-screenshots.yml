name: Store screenshots

# Manual only. Captures real NextMove screens with example data on an emulator
# (1440x2560) and wraps them in captioned frames for the Google Play listing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install fonts for captions
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build app and test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Capture screens on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          arch: x86
          profile: Nexus 6
          disable-animations: true
          script: |
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command network -e mobile show -e level 4 -e datatype none
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb shell rm -rf /data/local/tmp/store-shots
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pitchcode.nextmove.StoreScreenshotTest -Pandroid.testInstrumentationRunnerArguments.storeShots=true
            mkdir -p shots && adb pull /data/local/tmp/store-shots shots/
            ls -l shots/store-shots

      - name: Frame screenshots
        run: |
          java -Djava.awt.headless=true store/ScreenshotFrames.java shots/store-shots store-out
          mkdir -p store-out/raw && cp shots/store-shots/*.png store-out/raw/
          ls -lR store-out

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: nextmove-store-screenshots
          path: store-out
          if-no-files-found: error
          retention-days: 30
