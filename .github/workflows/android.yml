name: Android verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build and lint debug app
        run: gradle :app:assembleDebug :app:lintDebug

      - name: Launch smoke test on Android 8
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          arch: x86
          profile: Nexus 6
          disable-animations: true
          script: bash scripts/emulator-verify.sh

      - name: Verify permission contract
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          PERMISSIONS="$($ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$APK")"
          printf '%s\n' "$PERMISSIONS"
          grep -q "android.permission.POST_NOTIFICATIONS" <<< "$PERMISSIONS"
          grep -q "android.permission.RECORD_AUDIO" <<< "$PERMISSIONS"
          if grep -Eq "READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALENDAR|WRITE_CALENDAR|CALL_PHONE|READ_CALL_LOG|READ_CONTACTS|MANAGE_EXTERNAL_STORAGE|SCHEDULE_EXACT_ALARM" <<< "$PERMISSIONS"; then
            echo "Restricted phone-data permission found."
            exit 1
          fi

      - name: Verify local voice risk engine
        run: |
          mkdir -p /tmp/nextmove-tests
          javac -d /tmp/nextmove-tests \
            app/src/main/java/com/pitchcode/nextmove/safety/VoiceRiskAssessment.java \
            scripts/VoiceRiskAssessmentTest.java
          java -cp /tmp/nextmove-tests VoiceRiskAssessmentTest

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-smoke-api-26
          path: |
            startup-launch.txt
            startup-logcat.txt
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nextmove-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
