name: Publish prototype APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build and lint prototype
        run: gradle :app:assembleDebug :app:lintDebug

      - name: Launch smoke test on Android 8
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          arch: x86
          profile: Nexus 6
          disable-animations: true
          script: bash scripts/emulator-verify.sh

      - name: Resolve prototype version
        id: version
        run: |
          NAME="$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)"
          if [ -z "$NAME" ]; then
            echo "Could not read versionName from app/build.gradle" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName: $NAME"

      - name: Prepare public APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "NextMove-v${{ steps.version.outputs.name }}-prototype.apk"

      - name: Publish public prototype release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: "v${{ steps.version.outputs.name }}-prototype"
          APK: "NextMove-v${{ steps.version.outputs.name }}-prototype.apk"
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/refreshing the APK asset."
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" \
              "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "NextMove Android Prototype ${{ steps.version.outputs.name }}" \
              --notes "Android prototype. This build adds on-device message-alert scanning (SMS, WhatsApp and other chat apps) via Notification Access with scam alerts and safe next steps, plus a guided first-run setup flow. Live Gemini and internet threat intelligence remain transparently disconnected." \
              --prerelease
          fi
