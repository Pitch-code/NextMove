name: Publish prototype APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Build and lint prototype
        run: gradle :app:assembleDebug :app:lintDebug

      - name: Launch smoke test on Android 8
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 26
          arch: x86
          profile: Nexus 6
          disable-animations: true
          script: bash scripts/emulator-verify.sh

      - name: Prepare public APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NextMove-v0.2.0-prototype.apk

      - name: Publish public prototype release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0-prototype \
            NextMove-v0.2.0-prototype.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NextMove Android Prototype 0.2" \
            --notes "Android prototype with fixed in-app Back navigation, notification setup, explicit sample labels, privacy-safe permission explanations, English/Hindi voice description, preliminary on-device scam signals, and official India cyber-fraud actions. Live Gemini and internet threat intelligence remain transparently disconnected." \
            --prerelease
