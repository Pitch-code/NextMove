plugins {
    id "com.android.application"
}

android {
    namespace "com.pitchcode.nextmove"
    compileSdk 36

    defaultConfig {
        applicationId "com.pitchcode.nextmove"
        minSdk 26
        targetSdk 36
        versionCode 18
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // The Play upload key never lives in this public repo. The release workflow
    // decodes it from GitHub secrets into a temp file and passes these env vars.
    // Without them (e.g. normal CI), the release build is simply unsigned.
    def uploadKeystore = System.getenv("NEXTMOVE_KEYSTORE_PATH")
    signingConfigs {
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv("NEXTMOVE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NEXTMOVE_KEY_ALIAS")
                keyPassword System.getenv("NEXTMOVE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Code/resource shrinking is intentionally OFF. The app is ~2 MB and
            // uses only framework + Play SDKs, so shrinking saves almost nothing,
            // but R8's optimizer (with no keep rules) was stripping/renaming code
            // on the startup path and crashing the signed Play build on launch
            // ("NextMove keeps stopping") while the debug build ran fine.
            // Keeping this off trades a negligible size increase for a build that
            // behaves identically to the debug build testers were happy with.
            minifyEnabled false
            shrinkResources false
            if (uploadKeystore) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Regional-language files are machine-translated; any missing string
        // falls back to English at runtime rather than failing the build.
        disable "MissingTranslation", "ExtraTranslation"
    }
}

dependencies {
    implementation "com.android.billingclient:billing:8.0.0"
    implementation "com.google.android.gms:play-services-ads:23.6.0"

    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
