plugins {
    id "com.android.application"
}

android {
    namespace "com.pitchcode.nextmove"
    compileSdk 36

    defaultConfig {
        applicationId "com.pitchcode.nextmove"
        minSdk 26
        targetSdk 36
        versionCode 17
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // The Play upload key never lives in this public repo. The release workflow
    // decodes it from GitHub secrets into a temp file and passes these env vars.
    // Without them (e.g. normal CI), the release build is simply unsigned.
    def uploadKeystore = System.getenv("NEXTMOVE_KEYSTORE_PATH")
    signingConfigs {
        if (uploadKeystore) {
            upload {
                storeFile file(uploadKeystore)
                storePassword System.getenv("NEXTMOVE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("NEXTMOVE_KEY_ALIAS")
                keyPassword System.getenv("NEXTMOVE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (uploadKeystore) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Regional-language files are machine-translated; any missing string
        // falls back to English at runtime rather than failing the build.
        disable "MissingTranslation", "ExtraTranslation"
    }
}

dependencies {
    implementation "com.android.billingclient:billing:8.0.0"
    implementation "com.google.android.gms:play-services-ads:23.6.0"

    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
